name: CI Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Verify localization catalogs
        run: |
          set -euo pipefail
          mkdir -p build/swift-module-cache
          swift -module-cache-path build/swift-module-cache tools/localization/CatalogTool.swift verify

      - name: Run tests
        env:
          CUE_CI_SKIP_TESTS: |
            CueTests/GoogleDriveTests
            CueTests/DatabaseManagerTests
            CueTests/QuickAccessCoreTests/testQuickAccessCountdownTimer_pauseResumePreservesRemainingTime
            CueTests/QuickAccessCoreTests/testQuickAccessCountdownTimer_cancelPreventsExpiration
            CueTests/QuickAccessCoreTests/testQuickAccessTrackpadSwipeModeStore_persistsMode
            CueTests/QuickAccessCoreTests/testQuickAccessTrackpadSwipeModeStore_resetToDefault
            CueTests/OCRRecognitionTests
            CueTests/SmartElementCaptureControllerTests
            CueTests/SmartElementWindowOwnerResolverTests
            CueTests/SmartElementQueryServiceTests
            CueTests/SandboxOffDataMigrationServiceTests
            CueTests/AppStatusBarControllerTests
            CueTests/RecordingAudioLevelMeterTests
            CueTests/CaptureViewModelTests/testHiddenWindowSession_restore_postsSyntheticMouseMovedEvent
            CueTests/AnnotateBackgroundRedactionTests/testApplyBackgroundCutoutStartsProcessingOnSupportedOS
            CueTests/AnnotateBackgroundRedactionTests/testAutoRedactSensitiveDataStartsScan
            CueTests/AnnotateMockupTests/testMockupExporterRenderProducesImageWithSourceImage
            CueTests/AnnotateBlurCacheManagerTests/testGetCachedBlur_nonBlockingSchedulesRender
            CueTests/AreaSelectionMultiMonitorReconciliationTests/testMouseExited_hidesCoordinateIndicatorAndMagnifier
            CueTests/AreaSelectionMultiMonitorReconciliationTests/testIsMouseOver_evaluatesFrameAndVisibility
            CueTests/PersistedCombineSessionTests/testCaptureStitchSaveReopen_persistsStitchEverywhere
        run: |
          set -euo pipefail
          mkdir -p build
          rm -rf build/ci-test.xcresult
          test_args=()
          skip_tests_source="${CUE_CI_SKIP_TESTS:-${NOTINHAS_CI_SKIP_TESTS:-}}"
          if [[ -n "$skip_tests_source" ]]; then
            skip_tests="${skip_tests_source//$'\n'/ }"
            skip_tests="${skip_tests//,/ }"
            skip_tests="${skip_tests//;/ }"
            echo "Skipping XCTest identifiers from CUE_CI_SKIP_TESTS:"
            for test_id in $skip_tests; do
              [[ -z "$test_id" ]] && continue
              echo "  - $test_id"
              test_args+=("-skip-testing:$test_id")
            done
          fi

          if ! xcodebuild \
            -project Cue.xcodeproj \
            -scheme Cue \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ci-test.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            "${test_args[@]}" \
            test > build/ci-test.log 2>&1; then
            echo "::group::Likely test failures"
            grep -E "Test case '.*' failed|Failing tests:|\\*\\* TEST FAILED \\*\\*|error:" build/ci-test.log || true
            echo "::endgroup::"
            tail -200 build/ci-test.log
            exit 1
          fi

          tail -20 build/ci-test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-diagnostics
          path: |
            build/ci-test.log
            build/ci-test.xcresult

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p build

          if ! xcodebuild \
            -project Cue.xcodeproj \
            -scheme Cue \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build > build/ci-build.log 2>&1; then
            tail -100 build/ci-build.log
            exit 1
          fi

          tail -20 build/ci-build.log

      - name: Verify app bundle
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Cue.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Cue.app not found at expected path"
            exit 1
          fi
          echo "Build successful: $APP_PATH"
