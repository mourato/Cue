name: SwiftFormat Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: swiftformat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftformat:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Validate Formatting
        run: swiftformat Notinhas NotinhasTests --lint

      - name: Validate SwiftLint
        run: brew install swiftlint && swiftlint lint --config .swiftlint.yml Notinhas NotinhasTests
